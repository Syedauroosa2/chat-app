<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat - Login & Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-card">
        <h2 id="authTitle">Welcome to NexusChat</h2>
        <p id="authSubtitle">Login to continue chatting</p>

        <form id="authForm">
            <input type="text" id="username" placeholder="Full Name" style="display: none;">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <button type="submit" id="submitBtn">Login</button>
        </form>

        <p class="toggle-text">
            <span id="toggleMsg">Don't have an account?</span> 
            <a href="#" id="toggleAuth">Sign Up</a>
        </p>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
